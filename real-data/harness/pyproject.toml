[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "harness2-universe-real"
version = "1.0.0"
description = "Real-data Gaia NSS recursive triage harness with fixed scientific holds"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]
[project.scripts]
harness2-universe = "harness2.cli.universe:main"
[tool.setuptools.packages.find]
include = ["harness2*"]
