name: tests
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.lock && pip install --no-build-isolation --no-deps -e .
      - run: harness2-universe verify
      - run: python -m unittest discover -s tests -v
      - name: Baseline reproduces 500/17/14/0
        run: |
          harness2-universe run --output /tmp/base --cache /tmp/cache --memory /tmp/mem.json > /tmp/summary.json
          python -c "import json;s=json.load(open('/tmp/summary.json'));assert (s['records'],s['observable_above3'],s['anomaly_status_counts']['HOLD_QUALITY_AND_NOVELTY'],s['releasable_novel_candidates'])==(500,17,14,0),s"
      - name: Agent smoke test (heuristic, replay, no network)
        run: |
          mkdir -p /tmp/fx
          harness2-agent eval --run /tmp/base --limit 3 --fixtures /tmp/fx --out /tmp/ev
